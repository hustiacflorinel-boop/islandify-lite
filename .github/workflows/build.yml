name: Build Islandify Lite
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/islandify/lite
          cp IslandService.java app/src/main/java/com/islandify/lite/ || true
          
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <application android:label="Islandify Lite">
                  <service android:name=".IslandService" android:exported="false"/>
                  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/islandify/lite/MainActivity.java <<'EOF'
          package com.islandify.lite;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b){ super.onCreate(b);
              if(!Settings.canDrawOverlays(this)){ startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:"+getPackageName()))); }
              else { startService(new Intent(this, IslandService.class)); finish(); } }
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { compileSdk 34; defaultConfig { applicationId "com.islandify.lite"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" } }
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          EOF
          cat > settings.gradle <<'EOF'
          include ':app'
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :app:assembleDebug || gradle :app:assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Islandify-Lite-1.8MB
          path: app/build/outputs/apk/debug/*.apk
